version: v2beta1
name: plugin-agones-paper

deployments:
  app:
    namespace: games
    helm:
      releaseName: plugin-agones-paper
      chart:
        name: oci://ghcr.io/groundsgg/charts/agones-fleet
        version: 0.1.0
      values:
        image:
          repository: ghcr.io/groundsgg/paper
          tag: 0.3.0
        serverType: paper
        command: ["/bin/sh", "-c", "sleep infinity"]

dev:
  app:
    # Search for the container that runs this image
    imageSelector: ghcr.io/groundsgg/paper
    # Synchronize the plugin jar file to the plugins directory
    sync:
      - path: ./build/libs/*.jar:/app/plugins/*.jar
        initialSync: preferLocal
        file: true
    # Open a terminal and use the following command to start it
    terminal:
      disableReplace: true
      command: |
        echo "Use ./start.sh to start the server"
        /bin/sh
