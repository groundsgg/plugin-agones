name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.gradle
          {
            echo "github.user=${{ github.actor }}"
            # Reading only. PACKAGES_TOKEN can read packages owned by other private
            # repos (the groundsgg/minestom fork); this job's GITHUB_TOKEN cannot.
            # Unset falls back to GITHUB_TOKEN. Publishing uses the env token below.
            echo "github.token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
          } > ~/.gradle/gradle.properties

      - name: Spotless
        run: ./gradlew spotlessCheck

      - name: Build
        run: ./gradlew build --exclude-task test

      - name: Test
        run: ./gradlew test
